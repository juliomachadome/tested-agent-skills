name: Audit Codex skill isolation

on:
  pull_request:
    paths:
      - .github/workflows/codex-skill-isolation.yml
      - evals/public/lume-02-motion.json
      - scripts/audit-codex-context.py
      - scripts/codex-skill-compare.py
      - skills/web-motion/SKILL.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Codex CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/codex-context" --no-audit --no-fund @openai/codex@0.171.0
          echo "$RUNNER_TEMP/codex-context/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Audit visible prompt
        run: |
          codex --version
          python3 scripts/audit-codex-context.py
