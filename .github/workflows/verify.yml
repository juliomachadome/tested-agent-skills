name: Verify contribution

on:
  pull_request:
  push:
    branches: [main]

# This workflow receives no write token, secrets or deployment permissions.
permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check public-release safety
        run: python3 scripts/check-public-safety.py .
